<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <title>Fiahista & Ario — A quiet archive</title>
  <link href="assets/img/favicon.jpg" rel="icon">
  <link href="assets/img/favicon.jpg" rel="apple-touch-icon">

  <!-- FONTS (sama seperti index.html) -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:300;400;500&family=Poppins:300;400;500&family=Raleway:300;400;500&display=swap"
    rel="stylesheet">

  <!-- VENDOR CSS (sama seperti index.html) -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --qa-bg: #0f172a;
      --qa-panel: rgba(255, 255, 255, 0.04);
      --qa-panel-hover: rgba(255, 255, 255, 0.07);
      --qa-border: rgba(255, 255, 255, 0.09);
      --qa-text: #f1f1f1;
      --qa-muted: #9aa3b2;
      --qa-accent: #e7c9a9;
    }

    body {
      background-color: var(--qa-bg);
      color: var(--qa-text);
      font-family: 'Raleway', 'Roboto', sans-serif;
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    /* TOPBAR */
    .admin-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 520px;
      margin: 0 auto;
      padding: 1.5rem 1rem .5rem;
    }

    .admin-topbar .brand {
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 1.05rem;
      color: var(--qa-text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .admin-topbar .brand:hover { color: var(--qa-accent); }

    .admin-topbar .badge-admin {
      font-size: .68rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--qa-muted);
      border: 1px solid var(--qa-border);
      border-radius: 999px;
      padding: .25rem .65rem;
    }

    /* SECTIONS */
    .admin-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .admin-card {
      background: var(--qa-panel);
      border: 1px solid var(--qa-border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-top: 1.25rem;
    }

    .admin-heading {
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: 1.25rem;
    }

    .admin-heading i { color: var(--qa-accent); }

    .form-label {
      color: var(--qa-muted);
      font-size: .82rem;
      display: flex;
      align-items: center;
      gap: .4rem;
      margin-bottom: .4rem;
    }

    .form-control, .form-select {
      background-color: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid var(--qa-border) !important;
      color: var(--qa-text) !important;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--qa-accent) !important;
      box-shadow: 0 0 0 .2rem rgba(231, 201, 169, .15) !important;
    }

    .form-control::placeholder { color: var(--qa-muted); opacity: .7; }

    .btn-save {
      background-color: var(--qa-accent);
      border-color: var(--qa-accent);
      color: #1a1a1a;
      font-weight: 500;
    }

    .btn-save:hover, .btn-save:active {
      background-color: #dfb98f;
      border-color: #dfb98f;
      color: #1a1a1a;
    }

    .btn-save:disabled { opacity: .6; }

    /* GALLERY LIST */
    .gallery-row-item {
      background: var(--qa-panel) !important;
      border: 1px solid var(--qa-border) !important;
      border-radius: 12px !important;
      margin-bottom: .55rem;
      transition: background-color .15s ease;
    }

    .gallery-row-item:hover { background: var(--qa-panel-hover) !important; }

    .type-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      color: var(--qa-accent);
      flex-shrink: 0;
      font-size: 1rem;
    }

    .btn-hapus-gallery {
      border-radius: 9px;
    }

    #galleryLoadMoreBtn {
      border-radius: 10px;
      border-color: var(--qa-border);
      color: var(--qa-muted);
    }

    #galleryLoadMoreBtn:hover {
      color: var(--qa-text);
      border-color: var(--qa-accent);
    }

    hr.admin-divider {
      border-color: var(--qa-border);
      max-width: 520px;
      margin: 2rem auto;
    }
  </style>
</head>
<body>

  <div class="admin-topbar">
    <a href="index.html" class="brand">
      <i class="bi bi-house-door"></i>
      <span>Fiahista ✿ Ario</span>
    </a>
    <span class="badge-admin">Admin</span>
  </div>

  <div class="admin-wrap">

    <!-- UPLOAD FORM -->
    <div class="admin-card">
      <div class="admin-heading">
        <i class="bi bi-cloud-upload"></i>
        <span>Upload Kenangan Baru</span>
      </div>

      <form id="uploadForm">
        <!-- KATEGORI -->
        <div class="mb-3">
          <label for="category" class="form-label"><i class="bi bi-tag"></i> Kategori</label>
          <select id="category" class="form-select" required>
            <option value="filter-app">Photos</option>
            <option value="filter-product">Flowers</option>
            <option value="filter-branding">Videos</option>
          </select>
        </div>

        <!-- TANGGAL KENANGAN -->
        <div class="mb-3">
          <label for="datePicker" class="form-label"><i class="bi bi-calendar-heart"></i> Tanggal Kenangan</label>
          <input type="date" id="datePicker" class="form-control" style="color-scheme: dark;" required>
        </div>

        <!-- INPUT FOTO / BUNGA -->
        <div class="mb-3" id="photoInputGroup">
          <label for="fileInput" class="form-label"><i class="bi bi-images"></i> Pilih Foto (Bisa pilih sekaligus banyak)</label>
          <input type="file" id="fileInput" class="form-control" accept="image/*" multiple required>
          <small class="text-secondary d-block mt-1">* Foto pertama akan jadi Thumbnail depan. Maks 5MB/file. Foto otomatis dikompres sebelum diupload biar web-nya tetap ringan.</small>
        </div>

        <!-- INPUT VIDEO (YOUTUBE) -->
        <div class="mb-3 d-none" id="videoInputGroup">
          <label for="youtubeInput" class="form-label"><i class="bi bi-youtube"></i> Link / ID Video YouTube</label>
          <input type="text" id="youtubeInput" class="form-control" placeholder="https://www.youtube.com/watch?v=j4WCU8UFEas">
          <small class="text-secondary d-block mt-1">* Masukkan URL lengkap YouTube atau 11 digit ID Video.</small>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-save w-100 mt-3">
          <i class="bi bi-check2-circle me-1"></i> Simpan ke Web
        </button>
      </form>

      <div id="statusMsg" class="mt-3 text-center fw-bold"></div>
    </div>

    <!-- KELOLA KENANGAN -->
    <div class="admin-card">
      <div class="admin-heading">
        <i class="bi bi-collection"></i>
        <span>Kelola Kenangan yang Sudah Ada</span>
      </div>

      <div id="galleryList" class="list-group">
        <div class="text-secondary text-center py-3">Memuat data...</div>
      </div>
    </div>

  </div>

<script>
  const SUPABASE_URL = 'https://mklvshshxlqnawdqgumu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_9DLq4FnuySUEgje8y9Ba9w_PWV7Lnsy';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const categorySelect = document.getElementById('category');
  const photoGroup = document.getElementById('photoInputGroup');
  const videoGroup = document.getElementById('videoInputGroup');
  const fileInput = document.getElementById('fileInput');
  const youtubeInput = document.getElementById('youtubeInput');

  // Toggle Input & Validasi Required Dinamis
  categorySelect.addEventListener('change', () => {
    if (categorySelect.value === 'filter-branding') {
      photoGroup.classList.add('d-none');
      videoGroup.classList.remove('d-none');
      
      fileInput.removeAttribute('required');
      youtubeInput.setAttribute('required', 'true');
    } else {
      photoGroup.classList.remove('d-none');
      videoGroup.classList.add('d-none');
      
      fileInput.setAttribute('required', 'true');
      youtubeInput.removeAttribute('required');
    }
  });

  // Format Tanggal ke Bahasa Indonesia
  function formatDateToIndonesian(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString + 'T00:00:00');
    return date.toLocaleDateString('id-ID', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });
  }

  // ==========================================
  // KOMPRES FOTO SEBELUM UPLOAD
  // ==========================================
  // Resize ke max lebar 1600px + convert ke JPEG kualitas 0.82.
  // Tujuannya biar file yang naik ke Storage (dan didownload tiap
  // orang buka galeri) jauh lebih kecil dari foto asli HP (bisa 3-8MB).
  const COMPRESS_MAX_WIDTH = 1600;
  const COMPRESS_QUALITY = 0.82;

  function compressImage(file, maxWidth = COMPRESS_MAX_WIDTH, quality = COMPRESS_QUALITY) {
    return new Promise((resolve) => {
      // GIF (animasi) jangan dikompres, biar animasinya gak hilang
      if (file.type === 'image/gif') {
        resolve(file);
        return;
      }

      const objectUrl = URL.createObjectURL(file);
      const img = new Image();

      img.onload = () => {
        URL.revokeObjectURL(objectUrl);

        let { width, height } = img;

        if (width > maxWidth) {
          height = Math.round(height * (maxWidth / width));
          width = maxWidth;
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob((blob) => {
          if (!blob) {
            // Kalau gagal compress, tetap lanjut upload file aslinya
            resolve(file);
            return;
          }

          const compressedFile = new File(
            [blob],
            file.name.replace(/\.[^.]+$/, '.jpg'),
            { type: 'image/jpeg' }
          );
          resolve(compressedFile);
        }, 'image/jpeg', quality);
      };

      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        // Kalau gambarnya gagal dibaca, tetap lanjut upload file aslinya
        resolve(file);
      };

      img.src = objectUrl;
    });
  }

  // Ekstrak ID YouTube yang Lebih Valid & Aman
  function extractYoutubeId(url) {
    if (!url) return null;
    const cleanUrl = url.trim();
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = cleanUrl.match(regExp);
    
    if (match && match[2].length === 11) {
      return match[2];
    }
    return cleanUrl.length === 11 ? cleanUrl : null;
  }

  // Handle Submit Form
  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const statusMsg = document.getElementById('statusMsg');
    
    btn.disabled = true;
    statusMsg.className = 'mt-3 text-center text-warning';
    statusMsg.textContent = 'Sedang memproses... ⏳';

    try {
      const category = categorySelect.value;
      const rawDate = document.getElementById('datePicker').value;
      const titleDate = formatDateToIndonesian(rawDate);

      if (category === 'filter-branding') {
        // PROSES UNTUK VIDEO
        const ytInputVal = youtubeInput.value;
        const youtubeId = extractYoutubeId(ytInputVal);

        if (!youtubeId) {
          throw new Error('URL atau ID YouTube tidak valid!');
        }

        const { error } = await supabaseClient.from('gallery').insert([{
          type: category,
          title_date: titleDate,
          youtube_id: youtubeId,
          images: []
        }]);

        if (error) throw error;

      } else {
        // PROSES UNTUK FOTO / BUNGA
        const files = Array.from(fileInput.files);
        if (files.length === 0) throw new Error('Pilih minimal 1 foto!');

        const imageUrls = [];

        for (let file of files) {
          // Validasi Ukuran File (Maksimal 5MB) — dicek dari file asli sebelum dikompres
          if (file.size > 5 * 1024 * 1024) {
            throw new Error(`File ${file.name} terlalu besar (maksimal 5MB)!`);
          }

          statusMsg.textContent = `Mengompres ${file.name}... ⏳`;
          const uploadFile = await compressImage(file);

          const fileExt = uploadFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
          
          const { error: storageError } = await supabaseClient.storage
            .from('photos')
            .upload(fileName, uploadFile);

          if (storageError) throw storageError;

          const { data: urlData } = supabaseClient.storage
            .from('photos')
            .getPublicUrl(fileName);

          imageUrls.push(urlData.publicUrl);
        }

        const { error } = await supabaseClient.from('gallery').insert([{
          type: category,
          title_date: titleDate,
          images: imageUrls,
          youtube_id: null
        }]);

        if (error) throw error;
      }

      statusMsg.className = 'mt-3 text-center text-success';
      statusMsg.textContent = 'Berhasil diupload ke database! 🎉';
      document.getElementById('uploadForm').reset();
      
      // Reset state input required
      fileInput.setAttribute('required', 'true');
      youtubeInput.removeAttribute('required');
      photoGroup.classList.remove('d-none');
      videoGroup.classList.add('d-none');

      // Refresh daftar kenangan dari halaman pertama biar item baru langsung kelihatan
      loadGalleryList(true);

    } catch (err) {
      console.error(err);
      statusMsg.className = 'mt-3 text-center text-danger';
      statusMsg.textContent = 'Gagal: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  // ==========================================
  // KELOLA / HAPUS KENANGAN (dengan pagination)
  // ==========================================
  const galleryListEl = document.getElementById('galleryList');

  const GALLERY_ADMIN_PAGE_SIZE = 10;
  let adminGalleryOffset = 0;
  let adminGalleryHasMore = true;
  let adminGalleryLoading = false;

  function typeLabel(type) {
    if (type === 'filter-app') return 'Photos';
    if (type === 'filter-product') return 'Flowers';
    if (type === 'filter-branding') return 'Videos';
    return type;
  }

  function typeIcon(type) {
    if (type === 'filter-app') return 'bi-camera';
    if (type === 'filter-product') return 'bi-flower1';
    if (type === 'filter-branding') return 'bi-youtube';
    return 'bi-bookmark';
  }

  // URL publik Supabase Storage formatnya:
  // {SUPABASE_URL}/storage/v1/object/public/photos/<namafile>
  // Ekstrak nama file-nya biar bisa dihapus dari bucket.
  function extractStoragePath(url) {
    const marker = '/storage/v1/object/public/photos/';
    const idx = url.indexOf(marker);
    return idx === -1 ? null : url.substring(idx + marker.length);
  }

  function renderGalleryRow(item) {
    const thumb = item.type === 'filter-branding'
      ? `https://img.youtube.com/vi/${item.youtube_id}/default.jpg`
      : (item.images && item.images[0] ? item.images[0] : '');

    const row = document.createElement('div');
    row.className = 'list-group-item gallery-row-item d-flex align-items-center gap-3';
    row.innerHTML = `
      <img src="${thumb}" alt="" style="width:52px; height:52px; object-fit:cover; border-radius:9px; flex-shrink:0;">
      <div class="flex-grow-1">
        <div class="fw-bold text-white">${item.title_date}</div>
        <small class="text-secondary d-flex align-items-center gap-1">
          <i class="bi ${typeIcon(item.type)}"></i> ${typeLabel(item.type)}
        </small>
      </div>
      <button type="button" class="btn btn-outline-danger btn-sm btn-hapus-gallery" title="Hapus">
        <i class="bi bi-trash3"></i>
      </button>
    `;

    row.querySelector('.btn-hapus-gallery').addEventListener('click', () => {
      hapusGalleryItem(item, row);
    });

    return row;
  }

  function renderLoadMoreBtn() {
    let btn = document.getElementById('galleryLoadMoreBtn');

    if (!adminGalleryHasMore) {
      if (btn) btn.remove();
      return;
    }

    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'galleryLoadMoreBtn';
      btn.type = 'button';
      btn.className = 'btn btn-outline-light btn-sm w-100 mt-2';
      btn.innerHTML = '<i class="bi bi-arrow-down-circle me-1"></i> Muat Lebih Banyak';

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Memuat...';
        await loadGalleryList(false);
        // renderLoadMoreBtn() sudah dipanggil ulang di dalam loadGalleryList,
        // jadi tombol lama ini otomatis kepindah ke bawah / kehapus kalau habis.
      });

      galleryListEl.insertAdjacentElement('afterend', btn);
    }
  }

  // reset = true  → mulai dari halaman pertama (dipakai saat load awal / setelah upload baru)
  // reset = false → lanjut fetch halaman berikutnya (dipakai tombol "Muat Lebih Banyak")
  async function loadGalleryList(reset = true) {
    if (adminGalleryLoading) return;
    if (!reset && !adminGalleryHasMore) return;

    if (reset) {
      adminGalleryOffset = 0;
      adminGalleryHasMore = true;
      galleryListEl.innerHTML = '<div class="text-secondary text-center py-3">Memuat data...</div>';
      const oldBtn = document.getElementById('galleryLoadMoreBtn');
      if (oldBtn) oldBtn.remove();
    }

    adminGalleryLoading = true;

    const { data, error } = await supabaseClient
      .from('gallery')
      .select('*')
      .order('id', { ascending: false })
      .range(adminGalleryOffset, adminGalleryOffset + GALLERY_ADMIN_PAGE_SIZE - 1);

    adminGalleryLoading = false;

    if (error) {
      console.error(error);
      galleryListEl.innerHTML = '<div class="text-danger text-center py-3">Gagal memuat data: ' + error.message + '</div>';
      return;
    }

    if (reset) galleryListEl.innerHTML = '';

    if (!data || data.length === 0) {
      adminGalleryHasMore = false;
      if (galleryListEl.children.length === 0) {
        galleryListEl.innerHTML = '<div class="text-secondary text-center py-3">Belum ada kenangan yang diupload.</div>';
      }
      renderLoadMoreBtn();
      return;
    }

    adminGalleryOffset += data.length;
    if (data.length < GALLERY_ADMIN_PAGE_SIZE) {
      adminGalleryHasMore = false;
    }

    data.forEach((item) => {
      galleryListEl.appendChild(renderGalleryRow(item));
    });

    renderLoadMoreBtn();
  }

  async function hapusGalleryItem(item, row) {
    const konfirmasi = confirm(`Yakin mau hapus "${item.title_date}"? Aksi ini tidak bisa dibatalkan.`);
    if (!konfirmasi) return;

    const btn = row.querySelector('.btn-hapus-gallery');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split"></i>';

    try {
      // 1. Hapus file foto di Storage (kalau kategorinya foto/bunga)
      if (Array.isArray(item.images) && item.images.length > 0) {
        const paths = item.images.map(extractStoragePath).filter(p => p !== null);

        if (paths.length > 0) {
          const { error: storageError } = await supabaseClient
            .storage
            .from('photos')
            .remove(paths);

          // Kalau gagal hapus file storage (misal sudah kehapus manual
          // sebelumnya), jangan hentikan proses -- yang penting datanya
          // tetap terhapus dari tabel.
          if (storageError) console.error('Gagal hapus file storage:', storageError);
        }
      }

      // 2. Hapus baris di tabel gallery
      const { error: deleteError } = await supabaseClient
        .from('gallery')
        .delete()
        .eq('id', item.id);

      if (deleteError) throw deleteError;

      // 3. Hapus dari tampilan tanpa perlu reload semua data
      row.remove();

      // Geser cursor pagination mundur 1 supaya "Muat Lebih Banyak" berikutnya
      // gak nyasar/skip baris gara-gara satu baris barusan kehapus dari tabel.
      adminGalleryOffset = Math.max(0, adminGalleryOffset - 1);

      if (galleryListEl.children.length === 0 && !adminGalleryHasMore) {
        galleryListEl.innerHTML = '<div class="text-secondary text-center py-3">Belum ada kenangan yang diupload.</div>';
      }

    } catch (err) {
      console.error(err);
      alert('Gagal menghapus: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-trash3"></i>';
    }
  }

  loadGalleryList(true);
</script>
</body>
</html>
